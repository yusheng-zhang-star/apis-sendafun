# ============================================================
# 博客自动发布工作流
# cron: 每 2 天 UTC 17:00 == 北京时间 01:00 运行一次
# 1) 从 public/blog/drafts/ 取下一篇草稿
# 2) 发布到 public/blog/posts/ + posts.json（日期=今天）
# 3) 提交并 push 到 GitHub
# 4) 部署到 Cloudflare Workers
# 若无草稿可发布则跳过。
# ============================================================

name: Publish Blog Post

on:
  schedule:
    # 每 2 天的 17:00 UTC（北京时间次日 01:00）
    - cron: "0 17 */2 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publish next draft post
        id: publish
        run: node scripts/publish-next-post.mjs
        continue-on-error: true

      - name: Build blog posts data (merge posts.json + *.md)
        if: steps.publish.outcome == 'success'
        run: npm run build:posts

      - name: Commit and push if published
        if: steps.publish.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes. Skipping commit."
          else
            git commit -m "blog: publish post $(date -u +%Y-%m-%d)"
            git push origin main
          fi

      - name: Deploy to Cloudflare Workers
        if: steps.publish.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: dbacad9daf4c611ca4143f74fc33c2d3
        run: npx wrangler@4 deploy
