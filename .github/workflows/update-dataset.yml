# ============================================================
# 每日数据集自动更新工作流
# cron: UTC 16:00 == 北京时间 00:00 (UTC+8)，每天一次
# 拉取 public-apis 上游 README 生成 public/data/apis.json；
# 仅在内容有变更时提交并 push 到 main，触发 Cloudflare Workers 自动部署。
# 拉取/解析失败时脚本以非零码退出，跳过本次更新，保留旧数据，不破坏线上站点。
# ============================================================

name: Update API Dataset

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-dataset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync dataset from public-apis
        run: node scripts/update-dataset.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/apis.json
          if git diff --cached --quiet; then
            echo "No dataset changes. Skipping commit."
          else
            git commit -m "chore: sync API dataset $(date -u +%Y-%m-%d)"
            git push origin main
          fi
