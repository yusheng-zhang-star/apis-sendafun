# ============================================================
# 每日数据集自动更新 + 自动部署工作流
# cron: UTC 17:00 == 北京时间 01:00 (UTC+8)，每天一次
# 1) 拉取 public-apis 上游 README 生成 public/data/apis.json；
# 2) 若仓库内任一相关文件（数据集 / 前端 / Worker）发生变更则提交并 push；
# 3) 用 wrangler 部署到 Cloudflare Workers（apis.sendafun.com）。
# 拉取/解析失败时数据集脚本以非零码退出，跳过更新，保留旧数据，不破坏线上站点。
# 手动触发可传 force_deploy=true 强制部署一次（用于验证部署链路）。
# ============================================================

name: Update API Dataset

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Force deploy even if nothing changed"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-dataset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync dataset from public-apis
        run: node scripts/update-dataset.js

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes. Skipping commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: sync API dataset $(date -u +%Y-%m-%d)"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Workers
        if: steps.commit.outputs.changed == 'true' || inputs.force_deploy == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: dbacad9daf4c611ca4143f74fc33c2d3
        run: npx wrangler@4 deploy