# ============================================================
# Cloudflare Workers 配置 — apis-sendafun
# 纯静态 SPA：public/ 目录作为静态资源，SPA 回退到 index.html
# ============================================================

name = "apis-sendafun"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# 自定义域名 apis.sendafun.com 已在 Cloudflare Workers Custom Domains 持久绑定
# （独立于本文件，deploy 不需要 routes 权限；勿再加 routes，CI token 无 zone 路由权限）

[assets]
directory = "./public"
not_found_handling = "single-page-application"
