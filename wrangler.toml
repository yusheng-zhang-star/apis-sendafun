# ============================================================
# Cloudflare Workers 配置 — apis-sendafun
# 纯静态 SPA：public/ 目录作为静态资源，SPA 回退到 index.html
# ============================================================

name = "apis-sendafun"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# 自定义域名：Cloudflare 自动创建 DNS 记录并签发证书
# 注意：routes 必须放在 [assets] 等 table 段之前，否则会被解析为该段的子字段
routes = [
  { pattern = "apis.sendafun.com", custom_domain = true }
]

[assets]
directory = "./public"
not_found_handling = "single-page-application"
